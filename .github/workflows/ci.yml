name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FetchContent のソースとテスト用フォントを、全プリセット共通のディレクトリに置く
  # （プリセットごとの build/<preset>/ に置くと、同じものをジョブの数だけキャッシュすることになる）。
  DEPS_ARGS: >-
    -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/build/_deps
    -DSHASHOKU_TEST_ASSETS_DIR=${{ github.workspace }}/build/_assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-18 + libc++
            preset: dev
            packages: clang-18 libc++-18-dev libc++abi-18-dev
          - name: clang-18 + libc++ (ASan + UBSan)
            preset: asan
            packages: clang-18 libc++-18-dev libc++abi-18-dev
          - name: clang-18 + libc++ (Release)
            preset: release
            packages: clang-18 libc++-18-dev libc++abi-18-dev
          # 標準ライブラリ実装への依存を検出するため、libstdc++ でもビルドする
          - name: gcc-14 + libstdc++
            preset: gcc
            packages: g++-14
            cc: gcc-14
            cxx: g++-14
    env:
      # コンパイル結果のキャッシュ。CMake は初回 configure でこの環境変数を読む。
      # ビルド時間の大半は FreeType / HarfBuzz と、変更のないソースの再コンパイルが占める。
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache pngcheck ${{ matrix.packages }}
      - name: Cache dependency sources and test fonts
        uses: actions/cache@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
            build/_assets
          key: deps-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/TestAssets.cmake') }}
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          # キーは毎回変えて必ず保存し、復元は同じプリセットの直近のものから行う
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }} $DEPS_ARGS
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
          ccache --show-stats
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # 配布物（#20）と同じ設定で作ったバイナリを検査するジョブ。release.yml は
  # タグを push したときしか走らないので、壊れたことに気づくのはここ。
  dist:
    name: 配布と同じ設定（静的リンク + 既定フォント）
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache clang-18 libc++-18-dev libc++abi-18-dev
      - name: Cache dependency sources and test fonts
        uses: actions/cache@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
            build/_assets
          key: deps-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/TestAssets.cmake') }}
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-dist-${{ github.run_id }}
          restore-keys: ccache-dist-
      - name: Configure
        run: cmake --preset dist $DEPS_ARGS
      - name: Build
        run: cmake --build --preset dist
      # ゴールデン 16 枚と、examples の「そのまま貼れる 1 行」5 本（Cli.examples）を含む全件。
      - name: Test
        run: ctest --preset dist
      - name: Check that the executable is standalone
        run: |
          set -eu
          bin=build/dist/tools/shashoku/shashoku
          file "$bin"
          if readelf -d "$bin" | grep -q NEEDED; then
            echo "::error::動的依存が残っています（-static が効いていません）"
            readelf -d "$bin"
            exit 1
          fi
      # ビルドツールを何も入れていない素の Ubuntu で、置いたその場で動くこと。
      - name: Run in bare Ubuntu containers
        run: |
          set -eu
          mkdir -p dist/shashoku container_out
          cp build/dist/tools/shashoku/shashoku dist/shashoku/
          cp -R examples dist/shashoku/examples
          for image in ubuntu:22.04 ubuntu:24.04; do
            tag="${image/:/-}"
            docker run --rm \
              -v "$PWD/dist/shashoku:/opt/shashoku:ro" \
              -v "$PWD/container_out:/out" \
              -w /opt/shashoku "$image" \
              ./shashoku examples/og_card.html --image icon=examples/icon.png \
                -o "/out/$tag.png" --width 1200 --height 630
            head -c 8 "container_out/$tag.png" | od -An -tx1 | tr -d ' \n' \
              | grep -qx "89504e470d0a1a0a"
            echo "$image: OK ($(stat -c%s "container_out/$tag.png") B)"
          done

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # clang-tidy の対象を base との差分から決めるため
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-18 clang-format-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev
      - name: clang-format
        run: scripts/format.sh --check
      - name: Cache dependency sources and test fonts
        uses: actions/cache@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
            build/_assets
          key: deps-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/TestAssets.cmake') }}
      - name: Configure (compile_commands.json と依存ヘッダの取得)
        run: cmake --preset dev $DEPS_ARGS
      # PR では、変更された .cpp と「変更されたヘッダを include している .cpp」だけにかける
      # （選び方は scripts/tidy_select.py。lint に影響する設定が変わっていれば全ファイル）。
      - name: clang-tidy (changed files)
        if: github.event_name == 'pull_request'
        run: scripts/tidy.sh --changed "origin/${{ github.base_ref }}" build/dev
      # main への push では全ファイル。PR の差分検査をすり抜けたものをここで拾う。
      - name: clang-tidy (all files)
        if: github.event_name != 'pull_request'
        run: scripts/tidy.sh build/dev
