name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FetchContent のソースとテスト用フォントを、全プリセット共通のディレクトリに置く
  # （プリセットごとの build/<preset>/ に置くと、同じものをジョブの数だけキャッシュすることになる）。
  DEPS_ARGS: >-
    -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/build/_deps
    -DSHASHOKU_TEST_ASSETS_DIR=${{ github.workspace }}/build/_assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-18 + libc++
            preset: dev
            packages: clang-18 libc++-18-dev libc++abi-18-dev
          - name: clang-18 + libc++ (ASan + UBSan)
            preset: asan
            packages: clang-18 libc++-18-dev libc++abi-18-dev
          - name: clang-18 + libc++ (Release)
            preset: release
            packages: clang-18 libc++-18-dev libc++abi-18-dev
          # 標準ライブラリ実装への依存を検出するため、libstdc++ でもビルドする
          - name: gcc-14 + libstdc++
            preset: gcc
            packages: g++-14
            cc: gcc-14
            cxx: g++-14
    env:
      # コンパイル結果のキャッシュ。CMake は初回 configure でこの環境変数を読む。
      # ビルド時間の大半は FreeType / HarfBuzz と、変更のないソースの再コンパイルが占める。
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache pngcheck ${{ matrix.packages }}
      - name: Cache dependency sources and test fonts
        uses: actions/cache@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
            build/_assets
          key: deps-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/TestAssets.cmake') }}
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          # キーは毎回変えて必ず保存し、復元は同じプリセットの直近のものから行う
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }} $DEPS_ARGS
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
          ccache --show-stats
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # 配布物（#20）と同じ設定で作ったバイナリを検査するジョブ。release.yml は
  # タグを push したときしか走らないので、壊れたことに気づくのはここ。
  dist:
    name: 配布と同じ設定（ubuntu:22.04 の中でビルド）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # 依存のソースとフォントは他のジョブと同じ場所・同じ鍵で共有する。
      # コンテナには /src としてマウントするので、パスはコンテナ側の絶対パスで渡す。
      - name: Cache dependency sources and test fonts
        uses: actions/cache@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
            build/_assets
          key: deps-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/TestAssets.cmake') }}
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: build/_ccache
          key: ccache-dist-${{ github.run_id }}
          restore-keys: ccache-dist-
      # **ビルドは ubuntu:22.04 のコンテナの中で行う**（A39）。配布物は glibc を
      # 動的のままにしているので、ビルド機の glibc の版がそのまま「動く環境の下限」に
      # なる。ランナー（ubuntu-24.04 / glibc 2.39）で直接ビルドすると 22.04 で起動
      # できないバイナリができる。中身は scripts/dist_container_build.sh:
      # ツールチェーンの導入 → configure / build / ctest 全件（ゴールデン 16 枚と
      # Cli.examples を含む）→ NEEDED と要求 glibc の検査 → アーカイブの組み立て。
      # docker が要るので、この 2 ステップはローカルでは試せない（スクリプトの中身は
      # scripts/ に切り出してあり、apt 以外はローカルで実行して確かめてある）。
      # **このジョブ自体は最初の PR の CI が初回の実行になる。**
      - name: Build, test and pack inside ubuntu:22.04
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e CCACHE_DIR=/src/build/_ccache -e CCACHE_MAXSIZE=400M \
            ubuntu:22.04 bash scripts/dist_container_build.sh \
              -DFETCHCONTENT_BASE_DIR=/src/build/_deps \
              -DSHASHOKU_TEST_ASSETS_DIR=/src/build/_assets
      # ビルドツールを何も入れていない素の Ubuntu で、置いたその場で動くこと。
      - name: Run in bare Ubuntu containers
        run: scripts/smoke_dist_containers.sh build/package/shashoku-linux-x86_64

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # clang-tidy の対象を base との差分から決めるため
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-18 clang-format-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev
      - name: clang-format
        run: scripts/format.sh --check
      # Unicode の表（A20）が、固定した版の UCD から生成したものと一致するかを検査する。
      # UCD は 3 ファイル・約 1 MB。鍵にスクリプトを使うのは UCD_VERSION がそこにあるため。
      - name: Cache UCD
        id: ucd-cache
        uses: actions/cache@v5
        with:
          path: build/ucd
          key: ucd-${{ hashFiles('scripts/gen_unicode_tables.py') }}
          restore-keys: ucd-
      # ネットワークに出るのはキャッシュが外れたときのここだけ（取得もハッシュ固定）。
      - name: Fetch UCD (cache miss only)
        if: steps.ucd-cache.outputs.cache-hit != 'true'
        run: scripts/gen_unicode_tables.py --fetch
      # --offline なので、キャッシュがあるかぎりネットワーク障害で lint は落ちない。
      - name: Unicode tables match the pinned UCD
        run: scripts/gen_unicode_tables.py --check --offline
      - name: Cache dependency sources and test fonts
        uses: actions/cache@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
            build/_assets
          key: deps-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/TestAssets.cmake') }}
      - name: Configure (compile_commands.json と依存ヘッダの取得)
        run: cmake --preset dev $DEPS_ARGS
      # PR では、変更された .cpp と「変更されたヘッダを include している .cpp」だけにかける
      # （選び方は scripts/tidy_select.py。lint に影響する設定が変わっていれば全ファイル）。
      - name: clang-tidy (changed files)
        if: github.event_name == 'pull_request'
        run: scripts/tidy.sh --changed "origin/${{ github.base_ref }}" build/dev
      # main への push では全ファイル。PR の差分検査をすり抜けたものをここで拾う。
      - name: clang-tidy (all files)
        if: github.event_name != 'pull_request'
        run: scripts/tidy.sh build/dev
