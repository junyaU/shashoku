name: Release

# `v*` のタグを push したときだけ走る（#20）。ここで作るものが配布物のすべて:
# linux-x86_64 の実行ファイル 1 つ（C++ ランタイムを静的リンク + 既定フォントの埋め込み。
# glibc は動的なので **glibc 2.35 以降 = Ubuntu 22.04 以降**が前提。A-new-2）と、
# サンプル・README・ライセンスを入れた tar.gz、その SHA256。
#
# **ビルドは ubuntu:22.04 のコンテナの中で行う**。glibc を動的にしているので、
# ビルド機の glibc の版がそのまま「動く環境の下限」になる。ランナー（ubuntu-24.04 /
# glibc 2.39）で直接ビルドすると 22.04 で起動できないバイナリができる。
#
# **作るのはドラフトのリリース**。公開はユーザーが GitHub の Releases の画面で
# "Publish release" を押して行う（タグを push しただけでは公開されない）。
#
# 中身のほとんどは scripts/ に切り出してある（workflow に埋めるとローカルで一度も
# 動かせないため）。この workflow 自体は、最初にタグを push したときが初回の実行になる。
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # gh release create のため

env:
  ARCHIVE_NAME: shashoku-linux-x86_64

jobs:
  release:
    name: linux-x86_64（ubuntu:22.04 の中でビルド）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # ツールチェーンの導入 → configure / build / ctest 全件（ゴールデン 16 枚と
      # Cli.examples を含む）→ NEEDED と要求 glibc の検査 → アーカイブの組み立て。
      # 依存はキャッシュしない（リリースは滅多に走らないので、毎回取り直す）。
      - name: Build, test and pack inside ubuntu:22.04
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ubuntu:22.04 bash scripts/dist_container_build.sh

      # ビルドツールを何も入れていない素の Ubuntu で、展開して 1 コマンドで PNG が
      # 出ることを確かめる（#20 の受け入れ条件）。22.04 は glibc が古い側の下限。
      - name: Run in bare Ubuntu containers
        run: scripts/smoke_dist_containers.sh "build/package/$ARCHIVE_NAME"

      - name: Write the release notes
        run: |
          scripts/release_notes.sh \
            "build/package/$ARCHIVE_NAME/shashoku" \
            "build/package/$ARCHIVE_NAME.tar.gz" \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release_notes.md
          cat release_notes.md

      # **ドラフト**として作る。公開はユーザーが GitHub の Releases の画面で
      # 中身を確かめてから "Publish release" を押す（#20 の「決めること」5 番）。
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "shashoku $GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            "build/package/$ARCHIVE_NAME.tar.gz" \
            "build/package/$ARCHIVE_NAME.tar.gz.sha256"
          echo "ドラフトを作りました。GitHub の Releases で中身を確かめ、"
          echo '"Publish release" を押すと公開されます。'
