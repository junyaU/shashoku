<style>
  .page {
    margin: 0;
    padding: 48px 20px;
    background: #eceff1;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: #2b333b;
  }
  .card {
    width: 718px;
    margin: 0 auto;
    background: #fdfdfb;
    border: 1px solid #dfe3e6;
    border-radius: 14px;
  }
  .topbar {
    display: block;
    height: 6px;
    background: #637f6f;
  }
  .inner { padding: 30px 36px 32px; }
  .label-row { display: flex; margin-bottom: 16px; }
  .label {
    flex: none;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    color: #7a9484;
    border: 1px solid #c9d6ce;
    border-radius: 3px;
    padding: 2px 8px;
  }
  .term {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }
  .term-name {
    margin: 0;
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #26332c;
  }
  .yomi {
    font-size: 14px;
    color: #8a958e;
    letter-spacing: 0.08em;
  }
  .en {
    font-size: 12px;
    color: #a7b0aa;
    letter-spacing: 0.1em;
    margin: 0 0 24px;
  }
  .definition {
    font-size: 15px;
    line-height: 2;
    margin: 0 0 24px;
    color: #39443d;
  }
  .example {
    background: #f2f5f2;
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 26px;
  }
  .example-ttl {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #7a9484;
    margin-bottom: 6px;
  }
  .example-body {
    margin: 0;
    font-size: 14px;
    line-height: 1.9;
    color: #39443d;
  }
  .related-rule {
    height: 1px;
    background: #e7eae7;
  }
  .related {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 18px;
  }
  .related-ttl {
    font-size: 11.5px;
    color: #96a09a;
    margin-right: 2px;
  }
  .tag {
    font-size: 11.5px;
    color: #4c6b5a;
    background: #e8efe9;
    border: 1px solid #d3e0d6;
    border-radius: 999px;
    padding: 3px 12px;
    letter-spacing: 0.04em;
  }
</style>
<div class="page">
  <div class="card">
    <div class="topbar"></div>
    <div class="inner">
      <div class="label-row"><span class="label">社内用語集 / ENGINEERING</span></div>
      <div class="term">
        <h1 class="term-name">冪等性</h1>
        <span class="yomi">べきとうせい</span>
      </div>
      <p class="en">idempotency</p>

      <p class="definition">
        ある操作を 1 回行っても複数回行っても、システムの状態が同じ結果に落ち着く性質のこと。
        通信の切断やタイムアウトで同じ要求が再送されうる環境では、この性質を備えているかどうかが、そのまま安全に再試行できるかどうかを決める。
      </p>

      <div class="example">
        <div class="example-ttl">具体例</div>
        <p class="example-body">同じ注文 ID で決済 API を 2 回呼んでも、二重に課金されない</p>
      </div>

      <div class="related-rule"></div>
      <div class="related">
        <span class="related-ttl">関連語</span>
        <span class="tag">リトライ</span>
        <span class="tag">at-least-once</span>
      </div>
    </div>
  </div>
</div>
