<style>
  .page {
    background: #e8ecf1;
    padding: 32px 20px;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: #1d2530;
  }
  .card {
    width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
  }
  .head {
    background: #2f477d;
    color: #fff;
    padding: 26px 32px 24px;
  }
  .eyebrow {
    font-size: 11.5px;
    letter-spacing: 0.22em;
    color: #a9bde3;
    margin-bottom: 8px;
  }
  .head-title {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .metrics {
    display: flex;
    gap: 1px;
    background: #e9edf2;
    padding: 1px 0;
  }
  .metric {
    flex: 1 1 0;
    background: #fff;
    padding: 30px 24px 28px;
    text-align: center;
  }
  .label {
    font-size: 13px;
    color: #6b7684;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .value {
    font-size: 54px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #1d2530;
  }
  .unit {
    font-size: 20px;
    font-weight: 500;
    color: #4a5666;
  }
  .delta-row {
    display: flex;
    justify-content: center;
    margin-top: 14px;
  }
  .delta {
    flex: none;
    font-size: 14px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .delta.up   { color: #157347; background: #e3f5ec; }
  .delta.down { color: #c0392b; background: #fdeceb; }
  .delta.flat { color: #6b7684; background: #f0f2f5; }
  .ref {
    font-weight: 400;
    font-size: 12px;
  }
  .message-rule { height: 1px; background: #e9edf2; }
  .message {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin: 0;
    padding: 22px 32px 24px;
    background: #f7f9fc;
  }
  .icon { font-size: 22px; line-height: 1.4; }
  .message-text {
    margin: 0;
    font-size: 16px;
    line-height: 1.8;
    color: #2f3a48;
    font-weight: 500;
  }
  .foot-rule { height: 1px; background: #eef1f5; }
  .foot {
    padding: 12px 32px 16px;
    font-size: 11.5px;
    color: #9aa4b2;
    display: flex;
    justify-content: space-between;
  }
</style>
<div class="page">
  <div class="card">
    <div class="head">
      <div class="eyebrow">WEEKLY REPORT</div>
      <h1 class="head-title">今週のチーム活動（9/14〜9/20）</h1>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="label">マージした PR</div>
        <div class="value">42<span class="unit">件</span></div>
        <div class="delta-row"><div class="delta up"><span class="ref">前週比</span>▲ +8</div></div>
      </div>
      <div class="metric">
        <div class="label">レビューコメント</div>
        <div class="value">156<span class="unit">件</span></div>
        <div class="delta-row"><div class="delta down"><span class="ref">前週比</span>▼ −12</div></div>
      </div>
      <div class="metric">
        <div class="label">デプロイ</div>
        <div class="value">9<span class="unit">回</span></div>
        <div class="delta-row"><div class="delta flat"><span class="ref">前週比</span>±0</div></div>
      </div>
    </div>

    <div class="message-rule"></div>
    <div class="message">
      <div class="icon">📣</div>
      <p class="message-text">来週はリリース週です。木曜までに PR を出してください。</p>
    </div>

    <div class="foot-rule"></div>
    <div class="foot">
      <span>集計期間: 2026-09-14 〜 2026-09-20</span>
      <span>自動生成 / 毎週月曜 9:00</span>
    </div>
  </div>
</div>
