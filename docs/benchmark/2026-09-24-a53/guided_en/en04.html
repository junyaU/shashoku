<!-- en04: square quote card 1080x1080. 888 = 1080 - 96*2 (guide 3-(1), 4.14) -->
<style>
  .sheet { display: flex; flex-direction: column; width: 888px; height: 888px;

  .pad   { flex: none; height: 28px; }
  .body  { flex: 1 1 0; display: flex; flex-direction: column; justify-content: center; }
  .quote { margin: 0; font-size: 44px; line-height: 1.85; }
  .by    { flex: none; height: 28px; line-height: 28px; text-align: right;

</style>
<div class="sheet">
  <div class="pad"></div>
  <div class="body">
    <p class="quote">"A readable sentence is one where the reader breathes exactly where the writer intended. Punctuation is only the promise of that rhythm."</p>
  </div>
  <div class="by">&#8212; Iris Calloway, The Breath of Prose</div>
</div>
