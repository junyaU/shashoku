<!-- en05: weekly digest card, width 800, height follows the content -->
<style>
  .card    { padding: 32px; background: #ffffff; border: 1px solid #dfe3e8; border-radius: 14px; }
  .title   { margin: 0 0 6px 0; font-size: 26px; font-weight: bold; line-height: 1.4;
             color: #1b2733; }
  .sub     { margin: 0 0 20px 0; font-size: 14px; line-height: 1.5; color: #6b7a90; }
  .rule    { height: 1px; background: #e3e8ef; }
  .stats   { display: flex; gap: 20px; padding: 24px 0 4px 0; }
  .stat    { flex: 1 1 0; }
  .num     { font-size: 54px; font-weight: bold; line-height: 1.2; color: #1b2733; }
  .label   { margin: 2px 0 8px 0; font-size: 15px; line-height: 1.5; color: #44546a; }
  .up      { font-size: 16px; line-height: 1.5; font-weight: bold; color: #17803d; }
  .down    { font-size: 16px; line-height: 1.5; font-weight: bold; color: #c0392b; }
  .flat    { font-size: 16px; line-height: 1.5; font-weight: bold; color: #6b7a90; }
  .noterow { display: flex; padding: 20px 0 0 0; }
  .note    { flex: 1 1 0; padding: 12px 14px; border-radius: 8px; background: #fdf3e3;
             font-size: 15px; line-height: 1.6; color: #7a4a10; }
</style>
<div class="card">
  <div class="title">This week in engineering (Sep 14&#8211;20)</div>
  <div class="sub">junya.dev engineering digest</div>
  <div class="rule"></div>
  <div class="stats">
    <div class="stat">
      <div class="num">42</div>
      <div class="label">PRs merged</div>
      <div class="up">+8 vs last week</div>
    </div>
    <div class="stat">
      <div class="num">156</div>
      <div class="label">Review comments</div>
      <div class="down">&#8722;12 vs last week</div>
    </div>
    <div class="stat">
      <div class="num">9</div>
      <div class="label">Deploys</div>
      <div class="flat">&#177;0 vs last week</div>
    </div>
  </div>
  <div class="noterow">
    <div class="note">Release week is next week. Please open your PRs by Thursday.</div>
  </div>
</div>
