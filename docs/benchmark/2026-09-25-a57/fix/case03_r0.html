<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>用語カード：冪等性</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px;
    background: #eceff1;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: #2b333b;
  }
  .card {
    width: 720px;
    margin: 0 auto;
    background: #fdfdfb;
    border: 1px solid #dfe3e6;
    border-radius: 14px;
    box-shadow: 0 6px 22px rgba(43, 51, 59, 0.07);
    overflow: hidden;
  }
  .card::before {
    content: "";
    display: block;
    height: 6px;
    background: linear-gradient(90deg, #4c6b5a 0%, #7a9484 100%);
  }
  .inner { padding: 30px 36px 32px; }
  .label {
    display: inline-block;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    color: #7a9484;
    border: 1px solid #c9d6ce;
    border-radius: 3px;
    padding: 2px 8px;
    margin-bottom: 16px;
  }
  .term {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 4px;
  }
  .term h1 {
    margin: 0;
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #26332c;
  }
  .yomi {
    font-size: 14px;
    color: #8a958e;
    letter-spacing: 0.08em;
  }
  .en {
    font-size: 12px;
    color: #a7b0aa;
    letter-spacing: 0.1em;
    margin: 0 0 24px;
  }
  .definition {
    font-size: 15px;
    line-height: 2;
    margin: 0 0 24px;
    color: #39443d;
  }
  .example {
    background: #f2f5f2;
    border-left: 4px solid #7a9484;
    border-radius: 0 6px 6px 0;
    padding: 14px 18px;
    margin-bottom: 26px;
  }
  .example .ttl {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #7a9484;
    margin-bottom: 6px;
  }
  .example p {
    margin: 0;
    font-size: 14px;
    line-height: 1.9;
    color: #39443d;
  }
  .related {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 18px;
    border-top: 1px solid #e7eae7;
  }
  .related .ttl {
    font-size: 11.5px;
    color: #96a09a;
    margin-right: 2px;
  }
  .tag {
    display: inline-block;
    font-size: 11.5px;
    color: #4c6b5a;
    background: #e8efe9;
    border: 1px solid #d3e0d6;
    border-radius: 999px;
    padding: 3px 12px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <span class="label">社内用語集 / ENGINEERING</span>
      <div class="term">
        <h1>冪等性</h1>
        <span class="yomi">べきとうせい</span>
      </div>
      <p class="en">idempotency</p>

      <p class="definition">
        ある操作を 1 回行っても複数回行っても、システムの状態が同じ結果に落ち着く性質のこと。
        通信の切断やタイムアウトで同じ要求が再送されうる環境では、この性質を備えているかどうかが、そのまま安全に再試行できるかどうかを決める。
      </p>

      <div class="example">
        <div class="ttl">具体例</div>
        <p>同じ注文 ID で決済 API を 2 回呼んでも、二重に課金されない</p>
      </div>

      <div class="related">
        <span class="ttl">関連語</span>
        <span class="tag">リトライ</span>
        <span class="tag">at-least-once</span>
      </div>
    </div>
  </div>
</body>
</html>
