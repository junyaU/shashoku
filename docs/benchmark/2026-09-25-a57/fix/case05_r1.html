<style>
  * { box-sizing: border-box; }
  .page {
    margin: 0;
    padding: 0;
    background: #d8d4cc;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 1080px;
    height: 1080px;
    background: #f6f3ec;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 56px;
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: #33312c;
  }
  /* 内側の細い罫 */
  .frame {
    flex: 1;
    border: 1px solid rgba(120, 110, 95, 0.22);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 94px 74px;
  }
  .mark {
    font-size: 15px;
    letter-spacing: 0.4em;
    color: #a79c88;
    font-family: "Noto Sans JP", sans-serif;
    margin-bottom: 56px;
  }
  .quote {
    font-size: 46px;
    line-height: 2.1;
    font-weight: 500;
    letter-spacing: 0.04em;
    margin: 0;
  }
  .quote-open {
    font-size: 64px;
    color: #c4b9a3;
    line-height: 1;
  }
  .quote-close {
    color: #c4b9a3;
  }
  .rule {
    width: 96px;
    height: 1px;
    background: #bdb29c;
    margin: 64px 0 0 auto;
  }
  .credit {
    margin-top: 28px;
    text-align: right;
    line-height: 1.9;
  }
  .credit-title {
    display: block;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: #4a463e;
  }
  .credit-author {
    display: block;
    font-size: 17px;
    letter-spacing: 0.12em;
    color: #8c8371;
    font-family: "Noto Sans JP", sans-serif;
  }
</style>
<div class="page">
  <div class="card">
    <div class="frame">
      <div class="mark">読 書 メ モ</div>

      <p class="quote"><span class="quote-open">「</span>読みやすい文章とは、読み手が息をつく場所が、書き手の意図した場所と一致している文章のことだ。句読点は、その約束のしるしにすぎない。<span class="quote-close">」</span></p>

      <div class="rule"></div>
      <div class="credit">
        <span class="credit-title">『文章の呼吸』</span>
        <span class="credit-author">佐藤 一葉</span>
      </div>
    </div>
  </div>
</div>
