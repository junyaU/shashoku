<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>第 12 回 組版と文字の勉強会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #1b2430; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .poster {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(170deg, #223046 0%, #16202e 55%, #101822 100%);
    color: #f3f1ea;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    padding: 72px 76px 64px;
    display: flex;
    flex-direction: column;
  }
  .poster::before {
    content: "";
    position: absolute;
    right: -170px;
    top: -170px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(226, 171, 92, 0.30) 0%, rgba(226, 171, 92, 0) 68%);
  }
  .poster > * { position: relative; z-index: 1; }

  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
  }
  .series {
    font-size: 16px;
    letter-spacing: 0.34em;
    color: #e2ab5c;
  }
  .free {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #e8b567, #d4913c);
    color: #1a212c;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 11px 26px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(212, 145, 60, 0.35);
  }

  h1 {
    margin: 0 0 6px;
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", serif;
    font-size: 72px;
    font-weight: 700;
    line-height: 1.34;
    letter-spacing: 0.02em;
  }
  h1 .num {
    display: block;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: #9fb2c9;
    margin-bottom: 14px;
  }
  .rule {
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, #e2ab5c 0%, rgba(226, 171, 92, 0.05) 70%);
    margin: 28px 0 26px;
  }

  .meta {
    display: flex;
    gap: 56px;
    margin-bottom: 34px;
  }
  .meta .item .k {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #8ea3bc;
    margin-bottom: 7px;
  }
  .meta .item .v {
    font-size: 27px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .speakers-label {
    font-size: 14px;
    letter-spacing: 0.24em;
    color: #8ea3bc;
    margin-bottom: 16px;
  }
  .speakers {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1 1 auto;
  }
  .sp {
    display: flex;
    align-items: center;
    gap: 22px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-left: 4px solid #e2ab5c;
    border-radius: 10px;
    padding: 18px 24px;
  }
  .sp .name {
    flex: 0 0 300px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .sp .name rt {
    font-size: 11px;
    font-weight: 400;
    color: #b9c7d8;
    letter-spacing: 0.06em;
  }
  .sp .talk {
    font-size: 21px;
    color: #dfe6ef;
    letter-spacing: 0.01em;
  }
  .sp .talk::before {
    content: "「";
    color: #7f93ab;
  }
  .sp .talk::after {
    content: "」";
    color: #7f93ab;
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }
  .foot .apply-label {
    font-size: 14px;
    letter-spacing: 0.2em;
    color: #8ea3bc;
    margin-bottom: 6px;
  }
  .foot .url {
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: #f3f1ea;
  }
  .foot .note {
    text-align: right;
    font-size: 15px;
    line-height: 1.8;
    color: #9fb2c9;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="head">
      <div class="series">TYPESETTING MEETUP</div>
      <div class="free">🎟 参加無料</div>
    </div>

    <h1><span class="num">第 12 回</span>組版と文字の勉強会</h1>

    <div class="rule"></div>

    <div class="meta">
      <div class="item">
        <div class="k">日時</div>
        <div class="v">2026年10月8日（木）19:30〜21:00</div>
      </div>
      <div class="item">
        <div class="k">場所</div>
        <div class="v">オンライン（Zoom）</div>
      </div>
    </div>

    <div class="speakers-label">登壇者</div>
    <div class="speakers">
      <div class="sp">
        <div class="name"><ruby>高橋<rt>たかはし</rt></ruby> <ruby>遥<rt>はるか</rt></ruby></div>
        <div class="talk">縦書き CSS の現在地</div>
      </div>
      <div class="sp">
        <div class="name"><ruby>Chen Wei<rt>チェン ウェイ</rt></ruby></div>
        <div class="talk">CJK フォントのサブセット化</div>
      </div>
      <div class="sp">
        <div class="name"><ruby>佐々木<rt>ささき</rt></ruby> <ruby>陽向<rt>ひなた</rt></ruby></div>
        <div class="talk">ルビの自動生成</div>
      </div>
    </div>

    <div class="foot">
      <div>
        <div class="apply-label">申込</div>
        <div class="url">example.com/typeset12</div>
      </div>
      <div class="note">どなたでも参加できます<br>アーカイブ配信あり</div>
    </div>
  </div>
</body>
</html>
