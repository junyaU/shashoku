<!-- 縦中央揃え。2 通りある:
     (1) 横に並べたものの上下中央 → flex の親に align-items: center
     (2) 箱の中の 1 行だけを上下中央 → line-height を箱の height と同じ px にする
     shashoku docs/guide/examples/vcenter.html -o vcenter.png --width 640 -->
<style>

           color: #ffffff; font-size: 18px; font-weight: bold;
           text-align: center; line-height: 38px; }
  .label { flex: 1 1 0; font-size: 17px; line-height: 1.7; color: #1b2733; }
</style>
<div class="step">

  <div class="label">依存ライブラリを取得する（初回だけ時間がかかります）</div>
</div>
