<!-- OG 画像の典型レイアウト（DESIGN.md Phase 6 の受け入れ条件）。
     1200x630 で組む前提。この例は既定の content-box なので、
     width / height は padding を引いた値を書く（1040 = 1200 - 80*2、470 = 630 - 80*2）。
     先頭に `* { box-sizing: border-box }` を書けば引き算は要らず、
     width: 1200px; height: 630px と書ける（ARCHITECTURE.md A56）。
     アーカイブを展開したディレクトリ（`shashoku` と `examples/` が並んでいる場所）で、
     次の 1 行をそのまま貼れば PNG になる（--font は要らない。太字も既定フォントの Bold で出る）:

     ./shashoku examples/og_card.html --image icon=examples/icon.png -o og_card.png --width 1200 --height 630
-->
<style>
  .card   { display: flex; flex-direction: column; width: 1040px; height: 470px; padding: 80px;
            background: #12263f; color: #f1f3f5; }
  .head   { display: flex; align-items: center; gap: 24px; }
  .icon   { width: 96px; height: 96px; border-radius: 48px; }
  .site   { font-size: 36px; color: #a5d8ff; }
  .title  { flex: 1; margin: 40px 0 0 0; font-size: 64px; font-weight: 700; line-height: 1.35; }
  .footer { display: flex; justify-content: space-between; font-size: 28px; color: #adb5bd; }
  .tag    { background: #e8590c; color: white; }
</style>
<div class="card">
  <div class="head"><img class="icon" src="icon"><div class="site">shashoku（写植）</div></div>
  <h1 class="title">「行頭に句読点を落とさない」、それだけを絶対に守る組版エンジンを作った話。</h1>
  <div class="footer"><div>junyaU・2026年9月20日</div><div><span class="tag"> C++23 </span>　HTML → PNG</div></div>
</div>
