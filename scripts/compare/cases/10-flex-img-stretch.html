<!-- ケース 10: flex × <img>（align-items: stretch）。
     交差軸のサイズを auto にする（height 属性を書かない）ので、CSS どおりなら
     stretch で引き伸ばされる場面。A18「<img> は stretch で歪めない」は意図した差で、
     shashoku は 64x64 のまま、Chrome は行の高さまで縦に伸ばす。 -->
<div style="display:flex; align-items:stretch; width:400px; font-size:16px"><img src="box" width="64"><div style="flex:1">長いタイトルをここに置いて、画像と並べたときの高さの扱いを見ます。折り返して 2 行にします。</div></div>
